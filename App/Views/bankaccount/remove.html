{% extends "layout/base" %}

{% block title %}Suppression d'un compte bancaire{% endblock %}

{% block content %}
<section class="bg-light">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <h2>Supression d'un compte bancaire</h2>
                <form method="post">
                    <div class="form-group">
                        <label for="bankAccount_id">ID</label>
                        <input type="text" class="form-control" id="bankAccount_id" name="bankAccount[id]" readonly value="{{ $this.bankAccount.id }}">
                    </div>
                    <div class="form-group">
                        <label for="bankAccount_idOwner">Propriétaire</label>
                        <select class="form-select" id="bankAccount_idOwner" name="bankAccount[idOwner]" disabled>
                            <option value="{{ $this.bankAccount.idOwner }}">{{ $this.bankAccount.owner.firstname }} {{ $this.bankAccountowner.lastname }} ({{ $this.bankAccount.owner.mailAddress }})</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bankAccount_description">Description</label>
                        <input type="text" class="form-control" id="bankAccount_description" name="bankAccount[description]" readonly placeholder="Description" value="{{ $this.bankAccount.description }}">
                    </div>
                    <div class="form-group">
                        <a href="javascript:history.back()" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-danger">Supprimer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
