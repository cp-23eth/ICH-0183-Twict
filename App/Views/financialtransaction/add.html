{% extends "layout/base" %}

{% block title %}Ajout d'une transaction financière{% endblock %}

{% block content %}
<section class="bg-light">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <h2>Ajout d'une transaction financière</h2>
                <form method="post">
                    <div class="form-group">
                        <label for="financialTransaction_idSender">Expéditeur</label>
                        <select class="form-select" id="financialTransaction_idSender" name="financialTransaction[idSender]">
                            {% foreach($this.availableBankAccounts as $availableBankAccount): %}
                            <option value="{{ $availableBankAccount.id }}">{{ $availableBankAccount.owner.firstname }} {{ $availableBankAccount.owner.lastname }} ({{ $availableBankAccount.owner.mailAddress }}) - {{ $availableBankAccount.description }}</option>
                            {% endforeach %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="financialTransaction_idRecipient">Destinataire</label>
                        <select class="form-select" id="financialTransaction_idRecipient" name="financialTransaction[idRecipient]">
                            {% foreach($this.availableBankAccounts as $availableBankAccount): %}
                            <option value="{{ $availableBankAccount.id }}">{{ $availableBankAccount.owner.firstname }} {{ $availableBankAccount.owner.lastname }} ({{ $availableBankAccount.owner.mailAddress }}) - {{ $availableBankAccount.description }}</option>
                            {% endforeach %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="financialTransaction_amount">Montant</label>
                        <input type="text" class="form-control" id="financialTransaction_amount" name="financialTransaction[amount]" placeholder="Montant" value="{{ $this.financialTransaction.amount }}">
                    </div>
                    <div class="form-group">
                        <input type="hidden" name="{{ $this.csrf.key }}" value="{{ $this.csrf.value }}">
                        <a href="javascript:history.back()" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Sauver</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
