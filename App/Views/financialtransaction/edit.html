{% extends "layout/base" %}

{% block title %}Edition d'une transaction financière{% endblock %}

{% block content %}
<section class="bg-light">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <h2>Edition d'une transaction financière</h2>
                <form method="post">
                    <div class="form-group">
                        <label for="financialTransaction_id">ID</label>
                        <input type="text" class="form-control" id="financialTransaction_id" name="financialTransaction[id]" readonly value="{{ $this.financialTransaction.id }}">
                    </div>
                    <div class="form-group">
                        <label for="financialTransaction_idSender">Expéditeur</label>
                        <select class="form-select" id="financialTransaction_idSender" name="financialTransaction[idSender]">
                            {% foreach ($this.availableBankAccounts as $availableBankAccount): %}
                            {% $selected = '' %}
                            {% if ($availableBankAccount.id == $this.financialTransaction.idSender): %}
                            {% $selected = 'selected' %}
                            {% endif %}
                            <option value="{{ $availableBankAccount.id }}" {{ $selected }}>{{ $availableBankAccount.owner.firstname }} {{ $availableBankAccount.owner.lastname }} ({{ $availableBankAccount.owner.mailAddress }}) - {{ $availableBankAccount.description }}</option>
                            {% endforeach %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="financialTransaction_idRecipient">Destinataire</label>
                        <select class="form-select" id="financialTransaction_idRecipient" name="financialTransaction[idRecipient]">
                            {% foreach ($this.availableBankAccounts as $availableBankAccount): %}
                            {% $selected = '' %}
                            {% if ($availableBankAccount.id==$this.financialTransaction.idRecipient): %}
                            {% $selected = 'selected' %}
                            {% endif %}
                            <option value="{{ $availableBankAccount.id }}" {{ $selected }}>{{ $availableBankAccount.owner.firstname }} {{ $availableBankAccount.owner.lastname }} ({{ $availableBankAccount.owner.mailAddress }}) - {{ $availableBankAccount.description }}</option>
                            {% endforeach %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="financialTransaction_amount">Montant</label>
                        <input type="text" class="form-control" id="financialTransaction_amount" name="financialTransaction[amount]" placeholder="Montant" value="{{ $this.financialTransaction.amount }}">
                    </div>
                    <div class="form-group">
                        <a href="javascript:history.back()" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Sauver</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
