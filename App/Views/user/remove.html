{% extends "layout/base" %}

{% block title %}Edition d'un utilisateur{% endblock %}

{% block content %}
<section id="authentication" class="bg-light">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <h2>Supression d'un utilisateur</h2>
                <form method="POST">
                    <div class="form-group">
                        <label for="user_id">ID</label>
                        <input type="text" class="form-control" id="user_id" name="user[id]" readonly="readonly" value="{{ $this.user.id }}">
                    </div>
                    <div class="form-group">
                        <label for="user_firstname">Prénom</label>
                        <input type="text" class="form-control" id="user_firstname" name="user[firstname]" readonly="readonly" placeholder="Prénom" value="{{ $this.user.firstname }}">
                    </div>
                    <div class="form-group">
                        <label for="user_lastname">Nom</label>
                        <input type="text" class="form-control" id="user_lastname" name="user[lastname]" readonly="readonly" placeholder="Nom" value="{{ $this.user.lastname }}">
                    </div>
                    <div class="form-group">
                        <label for="user_mailAddress">Adresse email</label>
                        <input type="email" class="form-control" id="user_mailAddress" name="user[mailAddress]" readonly="readonly" placeholder="Adresse email" value="{{ $this.user.mailAddress }}">
                    </div>

                    <input type="hidden" name="{{ $this.csrf.key }}" value="{{ $this.csrf.value }}">
                    <a href="/user/index" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-danger">Supprimer</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
